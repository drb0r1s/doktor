[package]
name = "doktorr"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
doktorc = { path = "../doktorc" }
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
bincode = "1"
web-sys = "0.3.103"
